name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - build.gradle
      - settings.gradle
      - gradle.properties
      - gradle/wrapper/gradle-wrapper.properties
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - build.gradle
      - settings.gradle
      - gradle.properties
      - gradle/wrapper/gradle-wrapper.properties

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore Gradle dependency/plugin caches
        id: gradle-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-copilot-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-copilot-

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Warm Gradle cache – run full NeoForge build (best effort)
        continue-on-error: true
        run: JAVA_TOOL_OPTIONS='-Xmx512m -Xss512k -XX:+UseSerialGC' ./gradlew build --no-daemon --max-workers=1

      - name: Validate offline build prerequisites from cache (best effort)
        continue-on-error: true
        run: JAVA_TOOL_OPTIONS='-Xmx512m -Xss512k -XX:+UseSerialGC' ./gradlew --offline dependencies --no-daemon --max-workers=1

      - name: Save Gradle dependency/plugin caches
        if: always() && steps.gradle-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-copilot-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
