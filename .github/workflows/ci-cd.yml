name: Build and Release Mod JAR

on:
  push:
    branches:
      - 1.20.1
    tags:
      - 'forge-1.20.1-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build mod JAR
        run: ./gradlew --no-daemon clean build

      - name: Locate runtime JAR
        id: runtime-jar
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'aibot-*.jar' ! -name '*-slim.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            printf 'Expected exactly one runtime JAR, found %s:\n' "${#jars[@]}" >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi
          echo "path=${jars[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aibot-jars-${{ github.sha }}
          path: ${{ steps.runtime-jar.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.runtime-jar.outputs.path }}
          generate_release_notes: true
