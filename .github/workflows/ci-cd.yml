name: Build and Release Forge 1.7.10
on:
  push:
    branches: ["1.7.10"]
    tags: ["*"]
  pull_request:
    branches: ["1.7.10"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x gradlew && ./gradlew --no-daemon --max-workers=1 build
      - uses: actions/upload-artifact@v4
        with:
          name: AiBot-MC1.7.10-GTNH2.8.4
          path: build/libs/AiBot-MC1.7.10-GTNH2.8.4-1.0.1-gtnh284.jar
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/AiBot-MC1.7.10-GTNH2.8.4-1.0.1-gtnh284.jar
          generate_release_notes: true
