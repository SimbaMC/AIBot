plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = mod_version
group = mod_group_id

base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
}

repositories { mavenCentral() }

configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    shade 'javazoom:jlayer:1.0.1'
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configure {
    archiveClassifier = ''
    configurations = [project.configurations.shade]
    relocate 'javazoom.jl', 'com.bot.aibot.shadow.javazoom.jl'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/LICENSE*'
    mergeServiceFiles()
}

tasks.processResources {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.build.dependsOn tasks.shadowJar

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
